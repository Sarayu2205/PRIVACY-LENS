services:
  - type: web
    name: privacylens-backend
    runtime: python
    region: singapore
    plan: free
    buildCommand: "pip install -r requirements.txt && python -m spacy download en_core_web_sm || true"
    startCommand: "cd backend && uvicorn app.main:app --host 0.0.0.0 --port $PORT"
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: UPLOAD_DIR
        value: /tmp/uploads
      - key: REPORTS_DIR
        value: /tmp/reports
      - key: SPACY_MODEL
        value: en_core_web_sm
      - key: CORS_ORIGINS
        sync: false
      - key: PYTHON_VERSION
        value: 3.10.0
